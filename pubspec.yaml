name: ishkafel
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.242+242

environment:
  sdk: ^3.12.2

dependencies:
  args: ^2.4.0
  characters: ^1.4.1
  collection: ^1.19.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  # CLI 依赖树上的 core 文件只用 @immutable，不能为它拖进整个 flutter
  meta: ^1.16.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path: ^1.9.1
  path_provider: ^2.1.6

  crypto: any
  cryptography: ^2.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Ishkafel Subtitle
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Medium.otf
          weight: 500

# CLI 入口：`dart compile exe bin/ishkafel.dart`
executables:
  ishkafel: ishkafel
