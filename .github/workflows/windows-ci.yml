name: Windows CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'sync/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build CLI
        run: dart build cli
      - name: Build Windows app
        run: flutter build windows --release
      - name: Smoke-test subtitle renderer
        shell: pwsh
        run: ./scripts/windows/test_renderer.ps1 -Mode Release
      - uses: actions/upload-artifact@v4
        with:
          name: ishkafel-windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7
